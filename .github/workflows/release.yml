name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.2.0)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-nsis:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}".Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$v' — use semver like 0.2.0" }
          foreach ($f in @('package.json', 'src-tauri/tauri.conf.json')) {
            (Get-Content $f -Raw) -replace '"(version)":\s*"[^"]*"', "`"`$1`": `"$v`"" | Set-Content $f -NoNewline
          }
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"$v`"" | Set-Content src-tauri/Cargo.toml -NoNewline
          $lock = Get-Content src-tauri/Cargo.lock -Raw
          $lock = $lock -replace '(?m)^name = "tokentracker"\r?\nversion = "[^"]*"', "name = `"tokentracker`"`r`nversion = `"$v`""
          Set-Content src-tauri/Cargo.lock -Value $lock -NoNewline
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "release v$v"
          git push origin main

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "TokenTracker v__VERSION__"
          releaseBody: |
            ## TokenTracker v__VERSION__

            **Windows installer (NSIS):** download `TokenTracker_<version>_x64-setup.exe`, run it and TokenTracker is installed without admin rights. It lives in your system tray — click the icon to open the dashboard.

            ### What's new
            - See the commit history for this release.
          releaseDraft: false
          prerelease: false
