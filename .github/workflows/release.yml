name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nsis:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "TokenTracker v__VERSION__"
          releaseBody: |
            ## TokenTracker v__VERSION__

            **Windows installer (NSIS):** download `TokenTracker_<version>_x64-setup.exe`, run it and TokenTracker is installed without admin rights. It lives in your system tray — click the icon to open the dashboard.

            ### What's new
            - See the commit history for this release.
          releaseDraft: true
          prerelease: false
