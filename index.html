<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>TokenTracker</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-text">
            <span class="brand-name">TokenTracker</span>
            <span class="brand-tag">agent token &amp; cost tracker</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="last-updated" id="last-updated">—</span>
          <button class="btn btn-ghost" id="btn-settings" title="Display settings">⚙</button>
          <button class="btn btn-primary" id="btn-refresh">↻ Refresh</button>
        </div>
      </header>

      <main id="content">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>Scanning local agent data…</p>
        </div>

        <div id="dashboard" class="hidden">
          <div id="errors" class="errors hidden"></div>

          <nav class="tabs" id="tabs">
            <button data-tab="overview" class="on">Overview</button>
            <button data-tab="explore">Explore</button>
            <button data-tab="sessions">Sessions</button>
            <button data-tab="models">Models &amp; projects</button>
          </nav>
          <div id="filterbar" class="filterbar hidden"></div>

          <div id="tab-overview" class="tab">
            <section class="stats-grid" id="stats-grid"></section>

            <section class="panel" id="insights-panel">
              <div class="panel-head">
                <h2>Insights</h2>
                <span class="panel-sub">last 30 days</span>
              </div>
              <div class="kpi-row" id="insights"></div>
            </section>

            <section class="panel" id="quota-panel">
              <div class="panel-head">
                <h2>Live quotas</h2>
                <span class="panel-sub">reusing your existing logins · no new credentials</span>
              </div>
              <div class="quota-grid" id="quota-grid"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>Spend — last 14 days</h2>
              </div>
              <div class="chart-wrap" id="chart"></div>
            </section>

            <section class="agent-grid" id="agent-grid"></section>

            <section class="panel">
              <div class="panel-head">
                <h2>Recent sessions</h2>
                <span class="panel-sub">grouped per conversation</span>
                <span class="spacer"></span>
                <button class="btn btn-ghost btn-sm" id="btn-all-sessions">View all →</button>
              </div>
              <div class="table-wrap" id="sessions-table"></div>
            </section>
          </div>

          <div id="tab-explore" class="tab hidden"></div>
          <div id="tab-sessions" class="tab hidden"></div>
          <div id="tab-models" class="tab hidden"></div>
        </div>
      </main>

      <footer class="statusbar">
        <span id="status-left">Ready</span>
        <span id="status-right">TokenTracker</span>
      </footer>
      <div id="drawer" class="drawer hidden"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="settings-pop" class="pop hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
